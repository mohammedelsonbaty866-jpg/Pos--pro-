<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نقطة البيع POS</title>
<link rel="stylesheet" href="../css/pos.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="pos-header">
  <span>🧾 نقطة البيع</span>
  <span id="netStatus">● Online</span>
</header>

<section class="customer-bar">
  <select id="paymentType">
    <option value="cash">نقدي</option>
    <option value="credit">آجل</option>
  </select>

  <input id="customerName" placeholder="اسم العميل (إجباري في الآجل)">
</section>

<section class="search-bar">
  <input id="searchProduct" placeholder="🔍 اسم الصنف أو باركود">
</section>

<table id="cartTable">
  <thead>
    <tr>
      <th>الصنف</th>
      <th>الوحدة</th>
      <th>الكمية</th>
      <th>السعر</th>
      <th>✖</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<section class="totals">
  <div>الإجمالي: <span id="total">0</span> ج</div>
  <input id="discount" type="number" placeholder="خصم">
  <div>الصافي: <span id="net">0</span> ج</div>
</section>

<footer class="actions">
  <button onclick="saveSale()">💾 حفظ</button>
  <button onclick="printInvoice()">🖨️ طباعة</button>
</footer>

<script type="module" src="../js/firebase-init.js"></script>
<script type="module" src="../js/pos.js"></script>
</body>
</html>
