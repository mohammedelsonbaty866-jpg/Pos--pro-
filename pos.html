<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقطة البيع POS</title>

<link rel="stylesheet" href="css/pos.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="pos-header">
  <div>🟢 Online</div>
  <div>نقطة البيع</div>
</header>

<section class="top-bar">
  <select id="paymentType">
    <option value="cash">نقدي</option>
    <option value="credit">آجل</option>
  </select>

  <input id="customerName" placeholder="اسم العميل (إجباري في الآجل)">
</section>

<section class="search">
  <input id="searchInput" placeholder="🔍 اسم الصنف أو باركود">
</section>

<section class="products-grid" id="productsGrid">
  <!-- الأصناف -->
</section>

<section class="invoice">
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>ك</th>
        <th>س</th>
        <th>✖</th>
      </tr>
    </thead>
    <tbody id="cartBody"></tbody>
  </table>

  <div class="totals">
    <div>الإجمالي: <span id="total">0</span> ج</div>
    <input id="discount" type="number" placeholder="خصم">
    <div class="net">الصافي: <span id="net">0</span> ج</div>
  </div>

  <button class="save-btn" onclick="saveInvoice()">
    <i class="fa-solid fa-floppy-disk"></i> حفظ الفاتورة
  </button>
</section>

<script src="js/pos.js"></script>
</body>
</html>
