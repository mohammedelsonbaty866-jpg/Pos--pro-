<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS</title>
<link rel="stylesheet" href="../css/pos.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="pos-header">
  <span>🟢 Online</span>
  <span>نقطة البيع</span>
</header>

<section class="top-controls">
  <select id="paymentType">
    <option value="cash">نقدي</option>
    <option value="credit">آجل</option>
  </select>

  <input id="customerName" placeholder="اسم العميل (إجباري في الآجل)">
</section>

<section class="search">
  <input id="searchProduct" placeholder="🔍 اسم الصنف أو باركود">
</section>

<!-- ✅ شبكة الأصناف -->
<section class="products-grid" id="productsGrid">
  <!-- ديناميك -->
</section>

<!-- ✅ الفاتورة -->
<section class="invoice">
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>ك</th>
        <th>س</th>
        <th>✖</th>
      </tr>
    </thead>
    <tbody id="cartBody"></tbody>
  </table>

  <div class="totals">
    <div>الإجمالي: <span id="total">0</span> ج</div>
    <input id="discount" placeholder="خصم">
    <div class="net">الصافي: <span id="net">0</span> ج</div>
  </div>

  <button class="save-btn" onclick="saveSale()">
    💾 حفظ الفاتورة
  </button>
</section>

<script type="module" src="../js/firebase-init.js"></script>
<script type="module" src="../js/pos.js"></script>
</body>
</html>
