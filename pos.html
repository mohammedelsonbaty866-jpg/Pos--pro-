<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نقطة البيع</title>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- POS Style -->
  <link rel="stylesheet" href="css/pos.css">
</head>

<body class="dark">

<!-- ===== Top Bar ===== -->
<header class="pos-header">
  <div class="store-name">
    <i class="fa-solid fa-store"></i>
    <span id="storeName">اسم المتجر</span>
  </div>

  <div class="user-info">
    <span id="cashierName">كاشير</span>
    <span class="status online">●</span>
  </div>
</header>

<!-- ===== Search Product ===== -->
<section class="search-section">
  <input
    type="text"
    id="productSearch"
    placeholder="بحث سريع عن الصنف أو الباركود"
    oninput="searchProduct(this.value)"
  />
</section>

<!-- ===== Cart ===== -->
<section class="cart-section">
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>الوحدة</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="cartBody">
      <!-- items -->
    </tbody>
  </table>
</section>

<!-- ===== Customer & Payment ===== -->
<section class="info-section">

  <!-- Customer -->
  <div class="field">
    <label>العميل</label>
    <input
      type="text"
      id="customerName"
      placeholder="نقدي / اسم العميل"
    />
  </div>

  <!-- Sale Type -->
  <div class="field">
    <label>نوع البيع</label>
    <select id="saleType" onchange="handleSaleType()">
      <option value="cash">نقدي</option>
      <option value="credit">آجل</option>
    </select>
  </div>

  <!-- Payment -->
  <div class="field">
    <label>طريقة الدفع</label>
    <select id="paymentType" onchange="handlePaymentType()">
      <option value="cash">نقدي</option>
      <option value="transfer">تحويل</option>
    </select>
  </div>

</section>

<!-- ===== Total ===== -->
<section class="total-section">
  <span>الإجمالي</span>
  <strong id="totalAmount">0.00</strong>
</section>

<!-- ===== Actions ===== -->
<section class="actions">
  <button class="btn save" onclick="saveInvoice()">
    <i class="fa-solid fa-floppy-disk"></i>
    حفظ
  </button>

  <button class="btn print" onclick="printInvoice()">
    <i class="fa-solid fa-print"></i>
    طباعة
  </button>

  <button class="btn cancel" onclick="clearCart()">
    <i class="fa-solid fa-xmark"></i>
    إلغاء
  </button>
</section>

<!-- ===== Transfer Modal ===== -->
<div id="transferModal" class="modal hidden">
  <div class="modal-content">
    <h3>بيانات التحويل</h3>

    <select id="transferType">
      <option value="vodafone">Vodafone Cash</option>
      <option value="instapay">InstaPay</option>
    </select>

    <input type="text" id="transferAccount" placeholder="رقم الحساب / المحفظة">
    <input type="text" id="transferRef" placeholder="رقم المرجع (اختياري)">

    <button class="btn save" onclick="confirmTransfer()">تأكيد</button>
    <button class="btn cancel" onclick="closeTransfer()">إلغاء</button>
  </div>
</div>

<!-- ===== Scripts ===== -->
<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/pos.logic.js"></script>

</body>
</html>
