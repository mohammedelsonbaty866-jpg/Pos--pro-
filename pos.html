<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نقطة البيع POS</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    body {
      margin: 0;
      font-family: Tahoma;
      background: #020617;
      color: #fff;
    }

    .pos-container {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
    }

    /* ===== المنتجات ===== */
    .products {
      padding: 15px;
      overflow-y: auto;
    }

    .products h2 {
      margin-bottom: 10px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .product-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #1e293b;
    }

    .product-card:hover {
      transform: scale(1.04);
      background: #1e293b;
    }

    .product-card h4 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    .product-card span {
      font-size: 12px;
      color: #94a3b8;
    }

    /* ===== الفاتورة ===== */
    .invoice {
      background: #0f172a;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .invoice h2 {
      margin-bottom: 10px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #1e293b;
      padding: 6px;
      text-align: center;
    }

    th {
      color: #94a3b8;
    }

    .qty-controls button {
      background: #1e293b;
      color: #fff;
      border: none;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
    }

    .qty-controls button:hover {
      background: #334155;
    }

    .price-input {
      width: 60px;
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 4px;
      text-align: center;
    }

    .remove-btn {
      color: #ef4444;
      cursor: pointer;
    }

    /* ===== الإجمالي ===== */
    .summary {
      margin-top: auto;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .summary input {
      width: 80px;
      background: #020617;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #22c55e;
    }

    .actions {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .actions button {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .pay {
      background: #2563eb;
      color: #fff;
    }

    .print {
      background: #334155;
      color: #fff;
    }
  </style>
</head>

<body>

<div class="pos-container">

  <!-- المنتجات -->
  <div class="products">
    <h2>الأصناف</h2>
    <div class="product-grid" id="productGrid">
      <!-- منتجات ديناميك -->
    </div>
  </div>

  <!-- الفاتورة -->
  <div class="invoice">
    <h2>الفاتورة</h2>

    <table>
      <thead>
        <tr>
          <th>الصنف</th>
          <th>كمية</th>
          <th>السعر</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="invoiceBody"></tbody>
    </table>

    <div class="summary">
      <div>
        <span>الإجمالي</span>
        <span id="subTotal">0</span>
      </div>

      <div>
        <span>خصم</span>
        <input type="number" id="discount" value="0">
      </div>

      <div>
        <span>زيادة</span>
        <input type="number" id="extra" value="0">
      </div>

      <div class="total">
        <span>الإجمالي النهائي</span>
        <span id="finalTotal">0</span>
      </div>

      <div class="actions">
        <button class="pay">إتمام البيع</button>
        <button class="print">طباعة</button>
      </div>
    </div>

  </div>

</div>

<script type="module" src="./js/pos.js"></script>
</body>
</html>
