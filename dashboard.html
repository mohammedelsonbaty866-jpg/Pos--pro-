<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<!-- Top Bar -->
<header class="topbar">
  <div class="status">
    <span class="dot"></span> متصل
  </div>
  <div class="user">
    <i class="fa-solid fa-user-shield"></i>
    <span id="userName">Admin</span>
  </div>
</header>

<!-- Dashboard -->
<main class="dashboard">

  <div class="card primary" onclick="go('pos.html')">
    <i class="fa-solid fa-cash-register"></i>
    <span>نقطة البيع</span>
  </div>

  <div class="card" onclick="go('invoice.html')">
    <i class="fa-solid fa-file-invoice"></i>
    <span>الفواتير</span>
  </div>

  <div class="card" onclick="go('customers.html')">
    <i class="fa-solid fa-users"></i>
    <span>العملاء</span>
  </div>

  <div class="card admin" onclick="go('suppliers.html')">
    <i class="fa-solid fa-truck"></i>
    <span>الموردين</span>
  </div>

  <div class="card admin" onclick="go('products.html')">
    <i class="fa-solid fa-box"></i>
    <span>الأصناف</span>
  </div>

  <div class="card admin" onclick="go('stock.html')">
    <i class="fa-solid fa-warehouse"></i>
    <span>المخزون</span>
  </div>

  <div class="card admin" onclick="go('expenses.html')">
    <i class="fa-solid fa-money-bill-wave"></i>
    <span>المصروفات</span>
  </div>

  <div class="card admin" onclick="go('treasury.html')">
    <i class="fa-solid fa-wallet"></i>
    <span>الخزنة</span>
  </div>

  <div class="card admin" onclick="go('reports.html')">
    <i class="fa-solid fa-chart-line"></i>
    <span>التقارير</span>
  </div>

  <div class="card" onclick="go('settings.html')">
    <i class="fa-solid fa-gear"></i>
    <span>الإعدادات</span>
  </div>

</main>

<script src="js/dashboard.js"></script>
</body>
</html>
