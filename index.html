<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>

    <input id="phone" type="tel" placeholder="+2010xxxxxxxx" />

    <button id="sendCode" type="button">
      إرسال كود
    </button>

    <input id="code" type="text" placeholder="كود التحقق" />

    <button id="verifyCode" type="button">
      دخول
    </button>

    <div id="recaptcha-container"></div>
  </div>

  <!-- مهم جدًا: السكربت في آخر الصفحة -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
