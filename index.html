<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>

<h3>تسجيل الدخول برقم الموبايل</h3>

<input id="phone" placeholder="+2010xxxxxxxx"><br><br>
<div id="recaptcha-container"></div><br>

<button onclick="sendCode()">إرسال كود</button><br><br>

<input id="code" placeholder="الكود"><br><br>
<button onclick="verifyCode()">دخول</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBZwWxWIIE0exAPoL9P8pbmp19gnBFxQq0",
    authDomain: "pos-pro-996f0.firebaseapp.com",
    projectId: "pos-pro-996f0",
    storageBucket: "pos-pro-996f0.appspot.com",
    messagingSenderId: "591451935128",
    appId: "1:591451935128:web:683495139e62fb9b1e1bed"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
    'recaptcha-container',
    { size: 'normal' }
  );

  let confirmationResult;

  function sendCode() {
    const phone = document.getElementById("phone").value;
    auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
      .then(result => {
        confirmationResult = result;
        alert("تم إرسال الكود");
      })
      .catch(err => alert(err.message));
  }

  function verifyCode() {
    const code = document.getElementById("code").value;
    confirmationResult.confirm(code)
      .then(result => {
        alert("تم تسجيل الدخول");
        console.log(result.user);
      })
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
