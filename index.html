<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>

  <style>
    body{
      font-family: Arial;
      background:#0f1f3a;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:#fff;
    }
    .login-box{
      background:#1b2d4a;
      padding:30px;
      border-radius:16px;
      width:320px;
    }
    input,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      font-size:16px;
    }
    button{
      background:#2f6df6;
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>تسجيل الدخول</h2>

    <form id="loginForm">
      <input id="phone" type="text" placeholder="رقم الموبايل" required>
      <input id="password" type="password" placeholder="كلمة المرور" required>
      <button type="submit">دخول</button>
    </form>
  </div>

  <!-- مهم جدًا -->
  <script type="module" src="js/login.js"></script>
  <script type="module">
import { auth } from "./js/firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});
</script>
</body>
</html>
