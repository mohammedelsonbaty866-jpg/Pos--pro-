<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول</title>

  <style>
    body {
      font-family: sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 20px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #0d6efd;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2 style="text-align:center">تسجيل الدخول</h2>

  <input id="phone" placeholder="+2010xxxxxxxx" />
  <button id="sendCode">إرسال الكود</button>

  <input id="code" placeholder="كود التحقق" />
  <button id="loginBtn">دخول</button>

  <div id="recaptcha-container"></div>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
