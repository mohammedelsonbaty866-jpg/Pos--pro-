<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:Arial;background:#f5f5f5;padding:20px}
    .box{background:#fff;padding:20px;border-radius:10px;max-width:350px;margin:auto}
    input,button{width:100%;padding:10px;margin:8px 0}
    button{background:#2196f3;color:#fff;border:none;border-radius:5px}
  </style>
</head>
<body>

<div class="box">
  <h3>تسجيل الدخول</h3>

  <input id="phone" placeholder="+2010xxxxxxxx">
  <div id="recaptcha"></div>
  <button onclick="sendCode()">إرسال الكود</button>

  <input id="code" placeholder="كود التفعيل">
  <button onclick="confirmCode()">دخول</button>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
