<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المبيعات</title>

  <link rel="stylesheet" href="../css/menu.css">

  <style>
    body { background:#f4f6f9; }
    .page { padding:20px; }
    .card {
      background:#fff;
      padding:15px;
      border-radius:12px;
      margin-bottom:15px;
    }
    .row {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px;
    }
    input, select {
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
      width:100%;
    }
    button {
      padding:10px;
      border:none;
      border-radius:8px;
      background:#2f6df6;
      color:#fff;
      cursor:pointer;
    }
    table {
      width:100%;
      border-collapse:collapse;
    }
    th,td {
      padding:8px;
      border-bottom:1px solid #ddd;
      text-align:center;
    }
    th { background:#f1f3f6; }
    .total {
      font-size:20px;
      font-weight:bold;
      margin-top:10px;
      text-align:left;
    }
    .autocomplete {
  position: absolute;
  top: 100%;
  right: 0;
  left: 0;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  max-height: 200px;
  overflow-y: auto;
  z-index: 999;
}

.autocomplete div {
  padding: 10px;
  cursor: pointer;
}

.autocomplete div:hover {
  background: #f1f3f6;
}
  </style>
</head>

<body>

<!-- ===== المنيو ===== -->
<div class="sidebar" id="sidebar">
  <div class="menu-item active" onclick="go('sales.html')">🧾 المبيعات</div>
  <div class="menu-item" onclick="go('purchases.html')">📦 المشتريات</div>
  <div class="menu-item" onclick="go('items.html')">📋 الأصناف</div>
  <div class="menu-item" onclick="go('customers.html')">👥 العملاء</div>
  <div class="menu-item" onclick="go('suppliers.html')">🏭 الموردين</div>
  <div class="menu-item" onclick="go('stock.html')">📊 المخزون</div>
  <div class="menu-item" onclick="go('reports.html')">📈 التقارير</div>
  <div class="menu-item" onclick="go('settings.html')">⚙ الإعدادات</div>
  <div class="menu-toggle" onclick="toggleMenu()">⬅</div>
</div>

<!-- ===== المحتوى ===== -->
<div class="main-content">
<div class="page">

<h2>🧾 شاشة المبيعات</h2>

<!-- بيانات البيع -->
<div class="card">
  <div class="row">
    <select id="saleType">
      <option value="cash">نقدي</option>
      <option value="credit">آجل</option>
    </select>

    <select id="customerSelect">
      <option value="">-- اختر عميل --</option>
    </select>

    <input type="number" id="discount" placeholder="خصم">
  </div>
</div>
<!-- إضافة صنف -->
<div class="card">
  <div class="row">
    <div style="position:relative">
      <input
        type="text"
        id="itemSearch"
        placeholder="بحث سريع عن الصنف"
        oninput="searchItems(this.value)"
        autocomplete="off"
      >
      <div id="itemsList" class="autocomplete"></div>
    </div>

    <input type="number" id="qty" placeholder="الكمية" value="1">
    <input type="number" id="price" placeholder="سعر البيع">
    <button onclick="addItem()">إضافة</button>
  </div>
</div>


<!-- الفاتورة -->
<div class="card">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>الصنف</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>الإجمالي</th>
        <th>❌</th>
      </tr>
    </thead>
    <tbody id="invoiceBody"></tbody>
  </table>

  <div class="total">
    الإجمالي: <span id="total">0</span> جنيه
  </div>

  <br>
  <button onclick="saveSale()">💾 حفظ</button>
  <button onclick="window.print()">🖨 طباعة</button>
</div>

</div>
</div>

<script src="../js/menu.js"></script>

<script>
let invoice = [];
let total = 0;

// تحميل العملاء
const customers = JSON.parse(localStorage.getItem("customers")) || [];
customers.forEach(c => {
  customerSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
});

// تحميل الأصناف
const items = JSON.parse(localStorage.getItem("items")) || [];
items.forEach(i => {
  itemSelect.innerHTML += `<option value="${i.name}">${i.name}</option>`;
});

// عند اختيار صنف
itemSelect.onchange = () => {
  const item = items.find(i => i.name === itemSelect.value);
  if (item) price.value = item.price;
};

function addItem() {
  const name = itemSelect.value;
  const q = Number(qty.value);
  const p = Number(price.value);

  if (!name || q <= 0 || p <= 0) return alert("بيانات غير صحيحة");

  invoice.push({ name, qty:q, price:p, total:q*p });
  render();
}

function render() {
  invoiceBody.innerHTML = "";
  total = 0;

  invoice.forEach((i, index) => {
    total += i.total;
    invoiceBody.innerHTML += `
      <tr>
        <td>${index+1}</td>
        <td>${i.name}</td>
        <td>${i.qty}</td>
        <td>${i.price}</td>
        <td>${i.total}</td>
        <td><button onclick="removeItem(${index})">❌</button></td>
      </tr>`;
  });

  total -= Number(discount.value || 0);
  document.getElementById("total").innerText = total;
}

function removeItem(i) {
  invoice.splice(i,1);
  render();
}

function saveSale() {
  if (invoice.length === 0) return alert("الفاتورة فاضية");

  const type = saleType.value;
  const customer = type === "credit" ? customerSelect.value : "نقدي";
  if (type === "credit" && !customer) return alert("اختر عميل");

  // حفظ المبيعات
  const sales = JSON.parse(localStorage.getItem("sales")) || [];
  sales.push({
    id:Date.now(),
    type,
    customer,
    items:invoice,
    total,
    date:new Date().toLocaleString()
  });
  localStorage.setItem("sales",JSON.stringify(sales));

  // تحديث المخزون
  let stock = JSON.parse(localStorage.getItem("stock")) || {};
  invoice.forEach(i=>{
    stock[i.name]=(stock[i.name]||0)-i.qty;
  });
  localStorage.setItem("stock",JSON.stringify(stock));

  alert("تم حفظ الفاتورة");
  invoice=[];
  render();
}
</script>

</<script type="module" src="../js/guard.js"></script>body>
</html>
