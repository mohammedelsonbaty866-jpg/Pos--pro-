<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف</title>

  <link rel="stylesheet" href="../css/products.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="top-bar">
  <h2>إدارة الأصناف</h2>
  <button class="btn back" onclick="location.href='../dashboard.html'">
    <i class="fa fa-arrow-right"></i>
  </button>
</div>

<!-- ===== Add Product ===== -->
<div class="card form-card">
  <h3>إضافة / تعديل صنف</h3>

  <input id="name" placeholder="اسم الصنف">
  <input id="barcode" placeholder="الباركود">
  <input id="category" placeholder="التصنيف">

  <div class="row">
    <input id="buyPrice" type="number" placeholder="سعر الشراء">
    <input id="sellPrice" type="number" placeholder="سعر البيع">
  </div>

  <div class="row">
    <input id="minSell" type="number" placeholder="أقل سعر بيع">
    <input id="maxSell" type="number" placeholder="أقصى سعر بيع">
  </div>

  <input id="stock" type="number" placeholder="الكمية بالمخزون">

  <button onclick="saveProduct()" class="btn save">
    <i class="fa fa-save"></i> حفظ الصنف
  </button>
</div>

<!-- ===== Products Table ===== -->
<div class="card table-card">
  <input id="search" placeholder="بحث سريع (اسم / باركود)" oninput="loadProducts()">

  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>البيع</th>
        <th>المخزون</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="productsTable"></tbody>
  </table>
</div>

<script type="module" src="../js/firebase-init.js"></script>
<script type="module" src="../js/products.js"></script>

</body>
</html>
