<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف</title>

  <link rel="stylesheet" href="css/products.css">
</head>

<body>

<h2>إدارة الأصناف</h2>

<div class="container">

  <div class="form" id="productForm">
    <input id="name" placeholder="اسم الصنف">
    
    <select id="unit">
      <option value="قطعة">قطعة</option>
      <option value="علبة">علبة</option>
      <option value="كرتونة">كرتونة</option>
      <option value="كيلو">كيلو</option>
    </select>

    <input id="buyPrice" type="number" min="0" placeholder="سعر الشراء">
    <input id="minPrice" type="number" min="0" placeholder="أقل سعر بيع">
    <input id="maxPrice" type="number" min="0" placeholder="أقصى سعر بيع">

    <button id="addBtn" type="button">➕ إضافة صنف</button>
    <button id="exportBtn" type="button">⬇ تصدير Excel</button>
    <input type="file" id="importExcel" hidden>
    <button id="importBtn" type="button">⬆ استيراد Excel</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>اسم الصنف</th>
        <th>الوحدة</th>
        <th>شراء</th>
        <th>أدنى</th>
        <th>أقصى</th>
        <th>إجراء</th>
      </tr>
    </thead>
    <tbody id="productsBody"></tbody>
  </table>

</div>

<script type="module" src="js/products.js"></script>
</body>
</html>
