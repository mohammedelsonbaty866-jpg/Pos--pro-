<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف</title>

  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body>

<div class="top-bar">
  <h2>الأصناف</h2>
  <button class="btn-add" onclick="openModal()">
    <i class="fa fa-plus"></i> إضافة صنف
  </button>
</div>

<div class="products-container" id="productsList"></div>

<!-- Modal -->
<div class="modal" id="productModal">
  <div class="modal-content">

    <h3>إضافة / تعديل صنف</h3>

    <input id="name" placeholder="اسم الصنف">
    <input id="barcode" placeholder="الباركود">
    
    <select id="unit">
      <option value="">وحدة القياس</option>
      <option>قطعة</option>
      <option>علبة</option>
      <option>كرتونة</option>
      <option>كيلو</option>
      <option>جرام</option>
    </select>

    <div class="prices">
      <input id="minPrice" type="number" placeholder="أقل سعر بيع">
      <input id="maxPrice" type="number" placeholder="أقصى سعر بيع">
    </div>

    <input id="cost" type="number" placeholder="سعر الشراء">
    <input id="stock" type="number" placeholder="الكمية">

    <div class="actions">
      <button class="save" onclick="saveProduct()">حفظ</button>
      <button class="cancel" onclick="closeModal()">إلغاء</button>
    </div>

  </div>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/products.js"></script>
</body>
</html>
