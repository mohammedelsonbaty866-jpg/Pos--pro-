<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأصناف</title>

<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<div class="page">

  <header>
    <h2>📦 إدارة الأصناف</h2>
    <div class="actions">
      <button onclick="openModal()">➕ إضافة صنف</button>
      <button onclick="exportExcel()">⬇ Excel</button>
      <label class="import">
        ⬆ Excel
        <input type="file" id="importExcel" hidden>
      </label>
    </div>
  </header>

  <input class="search" placeholder="🔍 بحث بالاسم أو الباركود" onkeyup="search(this.value)">

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>الباركود</th>
          <th>الصنف</th>
          <th>الوحدات</th>
          <th>شراء</th>
          <th>أدنى</th>
          <th>أقصى</th>
          <th>الكمية</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="box">
    <h3>إضافة / تعديل صنف</h3>

    <input id="name" placeholder="اسم الصنف">
    <input id="barcode" placeholder="الباركود" readonly>

    <select id="unit">
      <option>قطعة</option>
      <option>علبة</option>
      <option>كرتونة</option>
      <option>كيلو</option>
      <option>لتر</option>
    </select>

    <input id="buy" type="number" placeholder="سعر الشراء">
    <input id="minSell" type="number" placeholder="أدنى بيع">
    <input id="maxSell" type="number" placeholder="أقصى بيع">
    <input id="qty" type="number" placeholder="الكمية">

    <div class="modal-actions">
      <button onclick="save()">💾 حفظ</button>
      <button class="cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/products.js"></script>
</body>
</html>
