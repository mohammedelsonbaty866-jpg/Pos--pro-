<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/products.css">

  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #020617, #020617);
      color: #e5e7eb;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .add-btn {
      background: #22c55e;
      border: none;
      color: #020617;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .table-wrapper {
      padding: 15px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #020617;
      border-radius: 16px;
      overflow: hidden;
      min-width: 800px;
    }

    thead {
      background: #020617;
    }

    th {
      padding: 12px;
      color: #22c55e;
      font-size: 14px;
      text-align: center;
    }

    td {
      padding: 10px;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 13px;
    }

    tr:hover {
      background: #020617;
    }

    .actions {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .actions button {
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .edit {
      background: #3b82f6;
      color: #fff;
    }

    .delete {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="page-header">
    <h2>📦 الأصناف</h2>
    <button class="add-btn" onclick="openProductModal()">+ إضافة صنف</button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>الباركود</th>
          <th>اسم الصنف</th>
          <th>الوحدة</th>
          <th>أقل سعر</th>
          <th>أقصى سعر</th>
          <th>سعر الشراء</th>
          <th>المخزون</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody id="productsList">
        <!-- يتم الحقن من products.js -->
      </tbody>
    </table>
  </div>

  <!-- JS -->
  <script src="js/firebase.js"></script>
  <script src="js/products.js"></script>

</body>
</html>
