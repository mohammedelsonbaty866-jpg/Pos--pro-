<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الأصناف</title>

  <link rel="stylesheet" href="css/products.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

</head>
<body>

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
  <h2>إدارة الأصناف</h2>
  <button class="btn primary" onclick="openProductModal()">
    <i class="fa fa-plus"></i> إضافة صنف
  </button>
</div>

<!-- ===== FILTERS ===== -->
<div class="filters">
  <input type="text" id="searchInput" placeholder="بحث باسم الصنف أو الباركود">
  <select id="categoryFilter">
    <option value="">كل الأقسام</option>
    <option value="none">بدون قسم</option>
  </select>

  <button class="btn" onclick="exportExcel()">تصدير Excel</button>
  <input type="file" id="excelFile" hidden onchange="importExcel(event)">
  <button class="btn" onclick="document.getElementById('excelFile').click()">استيراد Excel</button>
</div>

<!-- ===== TABLE ===== -->
<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th>الصنف</th>
      <th>الوحدة</th>
      <th>سعر الشراء</th>
      <th>أدنى بيع</th>
      <th>أقصى بيع</th>
      <th>الكمية</th>
      <th>إجراءات</th>
    </tr>
  </thead>
  <tbody id="productsTable"></tbody>
</table>
</div>

<!-- ===== MODAL ===== -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <h3 id="modalTitle">إضافة صنف</h3>

    <input id="pName" placeholder="اسم الصنف">
    <input id="pBarcode" placeholder="الباركود">
    
    <select id="pUnit">
      <option value="قطعة">قطعة</option>
      <option value="كرتونة">كرتونة</option>
      <option value="كيلو">كيلو</option>
      <option value="جرام">جرام</option>
      <option value="لتر">لتر</option>
    </select>

    <input type="number" id="pBuy" placeholder="سعر الشراء">
    <input type="number" id="pMin" placeholder="أدنى سعر بيع">
    <input type="number" id="pMax" placeholder="أقصى سعر بيع">
    <input type="number" id="pQty" placeholder="الكمية">

    <select id="pCategory">
      <option value="none">بدون قسم</option>
    </select>

    <div class="actions">
      <button class="btn primary" onclick="saveProduct()">حفظ</button>
      <button class="btn danger" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/products.js"></script>
</body>
</html>
