<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأصناف</title>

<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<header class="page-header">
  <h2>الأصناف</h2>
  <button class="btn-add" onclick="openModal()">
    <i class="fa fa-plus"></i> إضافة صنف
  </button>
</header>

<table class="products-table">
<thead>
<tr>
  <th>الاسم</th>
  <th>الباركود</th>
  <th>الوحدات</th>
  <th>المخزون</th>
  <th>إجراءات</th>
</tr>
</thead>
<tbody id="productsBody"></tbody>
</table>

<!-- Modal -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <h3>إضافة صنف</h3>

    <input id="name" placeholder="اسم الصنف">
    <input id="barcode" placeholder="الباركود">

    <h4>الوحدات</h4>
    <div id="units"></div>

    <button onclick="addUnit()">➕ إضافة وحدة</button>

    <input id="stock" type="number" placeholder="المخزون">

    <div class="modal-actions">
      <button onclick="saveProduct()">حفظ</button>
      <button class="cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script type="module" src="js/products.js"></script>
</body>
</html>
