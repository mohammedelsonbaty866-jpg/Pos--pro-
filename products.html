<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>الأصناف</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="dark">

<header class="page-header">
  <h2>الأصناف</h2>
  <div class="actions">
    <button id="addBtn" class="btn primary"><i class="fa fa-plus"></i> إضافة صنف</button>
    <button id="exportBtn" class="btn"><i class="fa fa-file-excel"></i> تصدير Excel</button>
    <button id="importBtn" class="btn"><i class="fa fa-file-import"></i> استيراد Excel</button>
    <input type="file" id="importFile" accept=".xlsx,.xls" hidden>
  </div>
</header>

<section class="table-wrap">
  <table id="productsTable">
    <thead>
      <tr>
        <th>الاسم</th>
        <th>الوحدة</th>
        <th>سعر الشراء</th>
        <th>أدنى بيع</th>
        <th>أقصى بيع</th>
        <th>الكمية</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<!-- Modal -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">إضافة صنف</h3>
    <form id="productForm">
      <input type="hidden" id="pid">

      <label>اسم الصنف</label>
      <input id="name" required>

      <label>وحدة القياس</label>
      <select id="unit">
        <option>قطعة</option>
        <option>كرتونة</option>
        <option>كيلو</option>
        <option>جرام</option>
        <option>لتر</option>
      </select>

      <label>سعر الشراء</label>
      <input id="buy" type="number" step="0.01" required>

      <label>أدنى سعر بيع</label>
      <input id="minSell" type="number" step="0.01" required>

      <label>أقصى سعر بيع</label>
      <input id="maxSell" type="number" step="0.01" required>

      <label>الكمية</label>
      <input id="qty" type="number" required>

      <div class="modal-actions">
        <button type="submit" class="btn primary">حفظ</button>
        <button type="button" id="closeModal" class="btn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/products.js"></script>
</body>
</html>
