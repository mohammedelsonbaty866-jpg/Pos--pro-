<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الأصناف</title>

<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet"
 href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="top">
  <h2>الأصناف</h2>
  <div class="actions">
    <button onclick="openModal()">➕ إضافة صنف</button>
    <button onclick="exportExcel()">📤 تصدير Excel</button>
    <button onclick="triggerImport()">📥 استيراد Excel</button>
    <button onclick="window.print()">🖨 طباعة</button>
    <input type="file" id="importFile" hidden>
  </div>
</header>

<table>
<thead>
<tr>
  <th>اسم الصنف</th>
  <th>الباركود</th>
  <th>الوحدات</th>
  <th>سعر الشراء</th>
  <th>البيع</th>
  <th>إجراءات</th>
</tr>
</thead>
<tbody id="productsBody"></tbody>
</table>

<!-- Modal -->
<div class="modal" id="productModal">
  <div class="box">
    <h3>إضافة صنف</h3>

    <input id="name" placeholder="اسم الصنف">
    <input id="barcode" placeholder="الباركود">
    <input id="buyPrice" type="number" placeholder="سعر الشراء">

    <h4>وحدات القياس</h4>
    <div id="units"></div>
    <button class="add-unit" onclick="addUnit()">➕ إضافة وحدة</button>

    <div class="modal-actions">
      <button onclick="saveProduct()">💾 حفظ</button>
      <button class="cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Excel Library -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<!-- Products Logic -->
<script type="module" src="js/products.js"></script>
</body>
</html>
